name: CI

on:
  push:
    branches: [main]
  pull_request:

# No secrets live in this file. DATABASE_URL is the throwaway service-container
# credential from .env.example (hooklab/hooklab, localhost only). It is set
# workflow-wide because `npm ci` runs backend postinstall `prisma generate`,
# and prisma.config.ts resolves env('DATABASE_URL') at config-load time — every
# job that installs dependencies needs it defined.
env:
  DATABASE_URL: postgresql://hooklab:hooklab@localhost:5432/hooklab

# A newer push to the same ref makes older runs pointless; cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
        working-directory: backend
      - name: ESLint backend (no --fix)
        run: npm run lint --workspace backend
      - name: ESLint frontend (no --fix)
        run: npm run lint --workspace frontend
      # WARN-ONLY until calibrated (conventions §5: new gates start warn-only,
      # 2-week calibration, then decide on blocking). Tree reading 2026-10-10,
      # re-verified after the dev-toolchain upgrade (jest 30 / vitest 4, rebuilt
      # lockfile): `npm audit --omit=dev` = 0 vulnerabilities; the full tree =
      # 20 moderate, ALL dev-only, all on the jest-30 / istanbul chain (via
      # @istanbuljs/load-nyc-config -> js-yaml and @jest/transform ->
      # babel-plugin-istanbul). npm's only offered fix is a breaking downgrade
      # (jest@25 / older ts-jest), which C12 forbids — so the full-tree count is
      # expected to stay ~20 until a future jest/ts-jest major offers a fixed
      # chain. A blocking gate on --omit=dev could flip on today; the dev-tree
      # gate stays warn-only.
      # Every command is `|| true` — the step can never fail the build.
      - name: npm audit, prod deps (warn-only-until-calibrated)
        run: |
          npm audit --omit=dev || true
          # Second pass only to turn the audit into a deterministic one-line
          # summary; the run above already prints every advisory in full.
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit.json" 2>/dev/null || true
          node -e '
            const fs = require("node:fs");
            try {
              const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/npm-audit.json", "utf8"));
              const summary = report.metadata && report.metadata.vulnerabilities;
              if (!summary) throw new Error("audit JSON carried no metadata.vulnerabilities");
              console.log("npm audit (--omit=dev, warn-only): " + summary.total + " vulnerabilities — info " + summary.info + ", low " + summary.low + ", moderate " + summary.moderate + ", high " + summary.high + ", critical " + summary.critical);
            } catch (error) {
              console.log("npm audit (--omit=dev, warn-only): could not summarise — " + error.message);
            }
          ' || true

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
        working-directory: backend
      - name: tsc backend (noEmit)
        run: npm run typecheck --workspace backend
      - name: tsc frontend (noEmit)
        run: npm run typecheck --workspace frontend
      - name: vite build frontend (tsc --noEmit && vite build)
        run: npm run build --workspace frontend
      # WARN-ONLY until calibrated (conventions §5). Baselines measured
      # 2026-10-10 on the vite production build (`npm run build --workspace frontend`,
      # single entry chunk pair index-*.js + index-*.css), after the
      # react-router-dom 6 -> 7.18.4 bump that closed GHSA-wrjc-x8rr-h8h6 and
      # GHSA-337j-9hxr-rhxg (the v6 line never shipped a fix; v7 costs ~30 kB raw):
      #   js  raw  325,561 B   gzip 102,112 B
      #   css raw   13,473 B   gzip   2,777 B
      # Thresholds are those baselines x 1.15 (~15% headroom) and print
      # actual-vs-threshold per asset class. Gzip numbers come from node zlib
      # level 9 — exactly what this step measures, so the 1.15 thresholds are
      # comparable. Vite's own report prints zlib defaults (level 6): measured
      # 102,227 B js / 2,791 B css, which is why nothing here is quoted from it.
      # The step is wrapped in `|| true` — it can never fail the build.
      - name: Bundle-size report (warn-only-until-calibrated)
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const zlib = require("node:zlib");
            const BASELINE_BYTES = { jsRaw: 325561, jsGzip: 102112, cssRaw: 13473, cssGzip: 2777 };
            const THRESHOLD_RAISE = 1.15;
            const format = (bytes) => bytes.toLocaleString("en-US");
            const sumAssets = (extension, compressed) => fs
              .readdirSync("frontend/dist/assets")
              .filter((name) => name.endsWith(extension))
              .reduce((sum, name) => {
                const content = fs.readFileSync(path.join("frontend/dist/assets", name));
                return sum + (compressed ? zlib.gzipSync(content, { level: 9 }).length : content.length);
              }, 0);
            try {
              const metrics = [
                ["js  raw ", sumAssets(".js", false), Math.ceil(BASELINE_BYTES.jsRaw * THRESHOLD_RAISE)],
                ["js  gzip", sumAssets(".js", true), Math.ceil(BASELINE_BYTES.jsGzip * THRESHOLD_RAISE)],
                ["css raw ", sumAssets(".css", false), Math.ceil(BASELINE_BYTES.cssRaw * THRESHOLD_RAISE)],
                ["css gzip", sumAssets(".css", true), Math.ceil(BASELINE_BYTES.cssGzip * THRESHOLD_RAISE)],
              ];
              let overThreshold = 0;
              for (const [label, actual, threshold] of metrics) {
                if (actual > threshold) overThreshold += 1;
                const verdict = actual > threshold ? "OVER by " + format(actual - threshold) + " B" : "ok";
                console.log(label + ": actual " + format(actual) + " B vs threshold " + format(threshold) + " B — " + verdict);
              }
              console.log("bundle budget (warn-only): " + overThreshold + "/" + metrics.length + " metrics over threshold");
            } catch (error) {
              console.log("bundle budget (warn-only): measurement failed — " + error.message);
            }
          ' || true

  unit-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hooklab
          POSTGRES_PASSWORD: hooklab
          POSTGRES_DB: hooklab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hooklab -d hooklab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
        working-directory: backend
      # Rate-limit specs (§8.2: 10-parallel-vs-55 on real PG) need applied
      # migrations, so deploy before jest — never `migrate dev` in CI.
      - name: Prisma migrate deploy
        run: npx prisma migrate deploy
        working-directory: backend
      - name: Prisma drift gate (C9)
        run: npx prisma migrate diff --exit-code --from-config-datasource --to-schema prisma/schema.prisma
        working-directory: backend
      - name: Backend Jest (colocated app.close() specs)
        run: npm run test --workspace backend
      - name: Frontend Vitest
        run: npm run test --workspace frontend
      # BUILD_PLAN §8.2 lists app.e2e-spec.ts in the testing plan, so it runs in
      # CI, not only on the dev machine. It boots the real AppModule, whose
      # validateEnv requires JWT_SECRET (≥32 chars) and PUBLIC_BASE_URL on top
      # of the workflow-wide DATABASE_URL — both are throwaway CI-only values
      # (same spirit as the service-container credentials), never real secrets.
      - name: Backend e2e (real AppModule against service Postgres)
        run: npm run test:e2e --workspace backend
        env:
          JWT_SECRET: ci-only-not-a-real-secret-0123456789abcdef
          PUBLIC_BASE_URL: http://localhost:3000

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Both Dockerfiles COPY monorepo paths (package-lock.json, backend/,
      # frontend/, docker/app-entrypoint.sh), so the build context is the repo
      # root and -f selects the Dockerfile. Build only — images are never pushed.
      - name: Build backend image (no push)
        run: docker build -f backend/Dockerfile -t hooklab-app .
      - name: Build frontend image (no push)
        run: docker build -f frontend/Dockerfile -t hooklab-web .
