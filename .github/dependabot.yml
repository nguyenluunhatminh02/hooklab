version: 2

updates:
  # Root workspace lockfile — npm workspaces resolve backend/ and frontend/
  # packages through it, so one entry covers the whole monorepo.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # exact-pin: BUILD_PLAN §9 #3
      - dependency-name: prisma
        update-types:
          - version-update:semver-major
      # exact-pin: BUILD_PLAN §9 #3
      - dependency-name: "@prisma/client"
        update-types:
          - version-update:semver-major
      # exact-pin: BUILD_PLAN §9 #3
      - dependency-name: "@prisma/adapter-pg"
        update-types:
          - version-update:semver-major

  # Actions used by .github/workflows/*.yml; Dependabot scans them from the
  # repo root, hence directory "/" rather than ".github".
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
